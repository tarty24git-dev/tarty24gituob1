<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Navigation Bar</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4" th:fragment="navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-primary" href="/dashboard">
            <i class="bi bi-diagram-3-fill me-2"></i><span th:text="${appName}">DataMatch Studio</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/comparison"><i class="bi bi-file-earmark-diff me-1"></i> File Comparison</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/reports"><i class="bi bi-table me-1"></i> Custom Reports</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/users"><i class="bi bi-people me-1"></i> User Management</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a href="/swagger-ui.html" target="_blank" class="btn btn-outline-info btn-sm">
                    <i class="bi bi-code-slash me-1"></i> Swagger API UI
                </a>
                <span class="text-light small">User: <strong th:text="${currentUsername}">admin</strong></span>
                <a href="/logout" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
